<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="description" content="כל המשחקים של אבי וקוקו במקום אחד — בוחרים משחק ומתחילים!">
  <meta property="og:title" content="משחקי המספרה | אבי וקוקו">
  <meta property="og:description" content="ציפור מספרה, אבן נייר ומספריים וטמפל מספרה. שלושה משחקים, QR אחד.">
  <title>משחקי המספרה | אבי וקוקו</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    html { background: #0b0b0d; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: #0b0b0d; color: #fff; }
    .page {
      width: min(440px, calc(100% - 36px));
      min-height: 100vh; min-height: 100dvh;
      margin: auto;
      padding: calc(20px + env(safe-area-inset-top)) 0 calc(19px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column;
    }
    .header { display: flex; align-items: center; justify-content: center; gap: 15px; padding-bottom: 22px; border-bottom: 1px solid #333438; }
    .faces { display: flex; align-items: center; flex: none; padding-left: 12px; }
    .faces img { width: 53px; height: 53px; object-fit: cover; border-radius: 50%; border: 2px solid #fff; background: #20202a; }
    .faces img + img { margin-right: -13px; }
    .heading { min-width: 0; }
    h1 { font-size: clamp(23px, 6vw, 29px); font-weight: 850; line-height: 1.12; margin: 0; letter-spacing: -.6px; }
    .heading p { margin: 5px 0 0; color: #b9b9c0; font-size: 13px; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 30px 0; }
    .game-link {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 68px; padding: 12px 18px;
      border-radius: 17px; border: 1px solid #f7f7f7;
      background: #fafafa; color: #111113;
      text-decoration: none; text-align: center;
      font-size: clamp(19px, 5.5vw, 24px); line-height: 1.2; font-weight: 850;
      transition: transform .12s ease, background .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .game-link:active { transform: scale(.985); background: #e7e7e7; }
    .game-link:focus-visible { outline: 3px solid #e6bd73; outline-offset: 4px; }
    footer { text-align: center; color: #aaaab0; font-size: 13px; font-weight: 600; padding-top: 8px; }
    @media (max-height: 600px) { .page { padding-top: 12px; padding-bottom: 12px; } .header { padding-bottom: 12px; } .faces img { width: 43px; height: 43px; } main { padding: 14px 0; gap: 11px; } .game-link { min-height: 58px; } }
    @media (prefers-reduced-motion: reduce) { .game-link { transition: none; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="faces" aria-hidden="true">
        <img src="assets/avi-face.webp" alt="" width="53" height="53">
        <img src="assets/koko-face.webp" alt="" width="53" height="53">
      </div>
      <div class="heading">
        <h1>משחקי המספרה</h1>
        <p>אבי וקוקו · בוחרים ומשחקים</p>
      </div>
    </header>
    <main id="games" aria-label="בחירת משחק">
      <a class="game-link" href="https://shalevg12.github.io/flappyBarber/">ציפור מספרה</a>
      <a class="game-link" href="https://shalevg12.github.io/barber-battle/">אבן נייר ומספריים</a>
      <a class="game-link" href="https://shalevg12.github.io/templeRunMaspera/">טמפל מספרה</a>
    </main>
    <footer>העיקר הבריאות והתסרוקת 💈</footer>
  </div>
  <script src="games.js"></script>
  <script>
    (() => {
      const games = window.BARBER_GAMES;
      if (!Array.isArray(games) || !games.length) return;
      const names = {
        "flappy-barber": "ציפור מספרה",
        "barber-battle": "אבן נייר ומספריים",
        "temple-run-maspera": "טמפל מספרה"
      };
      const order = ["flappy-barber", "barber-battle", "temple-run-maspera"];
      const ordered = [...games].sort((a, b) => {
        const aIndex = order.indexOf(a.id);
        const bIndex = order.indexOf(b.id);
        return (aIndex < 0 ? order.length : aIndex) - (bIndex < 0 ? order.length : bIndex);
      });
      const links = ordered
        .filter(game => typeof game.url === "string" && /^https:\/\//.test(game.url))
        .map(game => {
          const link = document.createElement("a");
          link.className = "game-link";
          link.href = game.url;
          link.textContent = names[game.id] || game.name || "משחק";
          return link;
        });
      if (links.length) document.getElementById("games").replaceChildren(...links);
    })();
  </script>
</body>
</html>
