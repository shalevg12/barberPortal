  <meta name="twitter:description" content="ציפור מספרה, אבן נייר ומספריים, וטמפל מספרה — בוחרים ומשחקים!">
  <meta name="twitter:image" content="https://shalevg12.github.io/barberPortal/assets/masperet-gabay-preview-v2.jpg">
  <link rel="canonical" href="https://shalevg12.github.io/barberPortal/">
  <title>מספרת גבאי | המשחקים של אבי וקוקו</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      --ink: #26364e;
      --muted: #63798a;
      --sky: #e6f8ff;
      --outline: #294663;
    }
    * { box-sizing: border-box; }
    html { background: var(--sky); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 4% 16%, #b1ebff 0 44px, transparent 46px),
        radial-gradient(circle at 94% 75%, #ffd98b66 0 63px, transparent 65px),
        linear-gradient(165deg, #def6ff 0%, #f5fcff 59%, #eaf9f2 100%);
      color: var(--ink);
      overflow-x: hidden;
    }
    .page {
      width: min(420px, calc(100% - 40px));
      min-height: 100vh;
      min-height: 100dvh;
      margin: auto;
      padding: calc(22px + env(safe-area-inset-top)) 0 calc(18px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      text-align: center;
    }
    .faces { display: flex; align-items: center; justify-content: center; padding-left: 12px; }
    .face {
      width: 61px;
      height: 61px;
      display: grid;
      place-items: center;
      border: 3px solid var(--outline);
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 4px 0 #29466324;
    }
    .face:first-child { background: #a1e4fd; transform: rotate(-9deg); }
    .face + .face { background: #ffe49c; margin-right: -11px; transform: rotate(9deg); }
    .face img { display: block; width: 100%; height: 100%; object-fit: contain; }
    h1 { font-size: clamp(26px, 7.5vw, 33px); font-weight: 950; line-height: 1.16; letter-spacing: -.8px; margin: 0; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 14px; font-weight: 700; }
    .bubble { position: relative; display: inline-block; }
    .bubble:after {
      content: "";
      position: absolute;
      left: -19px;
      top: 4px;
      width: 11px;
      height: 11px;
      background: #ffb951;
      border-radius: 4px 7px 4px 7px;
      transform: rotate(20deg);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(13px, 2.5dvh, 21px);
      padding: 26px 0;
    }
    .game-link {
      width: 100%;
      min-height: clamp(68px, 10.5dvh, 85px);
      padding: 10px 17px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 30px;
      align-items: center;
      gap: 9px;
      background: var(--button, #7cddff);
      color: #22344b;
      border: 2.5px solid var(--outline);
      border-radius: 25px;
      box-shadow: 0 5px 0 var(--outline);
      text-decoration: none;
      font-size: clamp(18px, 5vw, 23px);
      font-weight: 950;
      line-height: 1.18;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .game-link:nth-child(1) { --button: #8be4fb; }
    .game-link:nth-child(2) { --button: #ffe18c; }
    .game-link:nth-child(3) { --button: #a9eec3; }
    .game-link:hover { filter: saturate(1.12) brightness(1.02); transform: translateY(-2px); box-shadow: 0 7px 0 var(--outline); }
    .game-link:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--outline); }
    .game-link:focus-visible { outline: 3px solid #fe774f; outline-offset: 5px; }
    .game-icon {
      width: 45px;
      height: 45px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      background: #ffffff9c;
      font-size: 27px;
      box-shadow: inset 0 0 0 1px #ffffffb3;
    }
    .game-label { min-width: 0; }
    .arrow {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff9;
      font-size: 21px;
      line-height: 1;
      font-weight: 900;
    }
    footer {
      text-align: center;
      font-size: 13px;
      color: #49677b;
      font-weight: 850;
      padding-top: 7px;
    }
    .footer-heart { color: #f07182; }
    @media (max-height: 640px) {
      .page { padding-top: calc(12px + env(safe-area-inset-top)); padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
      .header { gap: 6px; }
      .face { width: 46px; height: 46px; }
      h1 { font-size: 24px; }
      .subtitle { font-size: 12px; margin-top: 2px; }
      main { gap: 12px; padding: 15px 0; }
      .game-link { min-height: 62px; border-radius: 20px; }
      .game-icon { width: 38px; height: 38px; font-size: 23px; border-radius: 12px; }
      .game-link { grid-template-columns: 39px minmax(0, 1fr) 28px; font-size: 19px; }
    }
    @media (max-width: 350px) {
      .page { width: calc(100% - 26px); }
      .game-link { padding: 10px; gap: 6px; font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .game-link { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="faces" aria-hidden="true">
        <span class="face"><img src="assets/avi-face.webp" alt="" width="61" height="61"></span>
        <span class="face"><img src="assets/koko-face.webp" alt="" width="61" height="61"></span>
      </div>
      <div>
        <h1><span class="bubble">משחקי המספרה 🎮</span></h1>
        <p class="subtitle">אבי וקוקו מזמינים אתכם לשחק!</p>
      </div>
    </header>

    <main id="games" aria-label="בחירת משחק">
      <a class="game-link" href="https://shalevg12.github.io/flappyBarber/"><span class="game-icon" aria-hidden="true">🐤</span><span class="game-label">ציפור מספרה</span><span class="arrow" aria-hidden="true">←</span></a>
      <a class="game-link" href="https://shalevg12.github.io/barber-battle/"><span class="game-icon" aria-hidden="true">✌️</span><span class="game-label">אבן נייר ומספריים</span><span class="arrow" aria-hidden="true">←</span></a>
      <a class="game-link" href="https://shalevg12.github.io/templeRunMaspera/"><span class="game-icon" aria-hidden="true">🏃</span><span class="game-label">טמפל מספרה</span><span class="arrow" aria-hidden="true">←</span></a>
    </main>

    <footer>העיקר הבריאות והתסרוקת <span class="footer-heart">♥</span> 💈</footer>
  </div>
  <script src="games.js"></script>
  <script>
    (() => {
      const games = window.BARBER_GAMES;
      if (!Array.isArray(games) || !games.length) return;

      const names = {
        "flappy-barber": "ציפור מספרה",
        "barber-battle": "אבן נייר ומספריים",
        "temple-run-maspera": "טמפל מספרה"
      };
      const icons = {
        "flappy-barber": "🐤",
        "barber-battle": "✌️",
        "temple-run-maspera": "🏃"
      };
      const order = ["flappy-barber", "barber-battle", "temple-run-maspera"];
      const ordered = [...games].sort((a, b) => {
        const ai = order.indexOf(a.id);
        const bi = order.indexOf(b.id);
        return (ai < 0 ? order.length : ai) - (bi < 0 ? order.length : bi);
      });
      const links = ordered
        .filter(game => typeof game.url === "string" && /^https:\/\//.test(game.url))
        .map(game => {
          const link = document.createElement("a");
          link.className = "game-link";
          link.href = game.url;
          const icon = document.createElement("span");
          icon.className = "game-icon";
          icon.setAttribute("aria-hidden", "true");
          icon.textContent = icons[game.id] || "🎮";
          const label = document.createElement("span");
          label.className = "game-label";
          label.textContent = names[game.id] || game.name || "משחק";
          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.setAttribute("aria-hidden", "true");
          arrow.textContent = "←";
          link.append(icon, label, arrow);
          return link;
        });
      if (links.length) document.getElementById("games").replaceChildren(...links);
    })();
  </script>
</body>
</html>
